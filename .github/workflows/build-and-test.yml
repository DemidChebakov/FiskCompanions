name: Build and test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from git tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fisk's Heroes is not redistributable, so it is fetched from Modrinth at build time
      - name: Download Fisk's Heroes
        run: |
          mkdir -p libs
          curl -fsSL -o libs/FiskHeroes-1.7.10-2.4.0.jar \
            https://cdn.modrinth.com/data/eFDDpt8w/versions/DdwTKPte/FiskHeroes-1.7.10-2.4.0.jar

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: fiskcompanions
          path: build/libs/*.jar
          retention-days: 7

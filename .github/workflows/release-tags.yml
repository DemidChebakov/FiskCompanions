name: Release tagged build

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from git tags

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Fisk's Heroes is not redistributable, so it is fetched from Modrinth at build time
      - name: Download Fisk's Heroes
        run: |
          curl -fsSL -o libs/FiskHeroes-1.7.10-2.4.0.jar \
            https://cdn.modrinth.com/data/eFDDpt8w/versions/DdwTKPte/FiskHeroes-1.7.10-2.4.0.jar

      - name: Build
        run: ./gradlew build

      - name: Attach jar to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/fiskcompanions-${{ github.ref_name }}.jar
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
